version: '3.9'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ../backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/social-platform
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:80'

volumes:
  mongo-data:
